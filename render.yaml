services:
  - type: web
    name: backend-restopilot
    runtime: docker
    branch: develop
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase,supabase-api,cloud
      - key: DEMO_ENABLED
        value: "false"
      - key: RESTOPILOT_AI_CHAT_PROVIDER
        value: google-genai
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: RESTOPILOT_CORS_ALLOWED_ORIGINS
        value: https://restopilot-vercel-ready.vercel.app
      - key: SUPABASE_AUTH_ISSUER
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
