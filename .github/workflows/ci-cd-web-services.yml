name: CI/CD Web Services - RestoPilot

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Web Services (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run Unit & Integration Tests (Spring AI, Reportes, Seguridad)
        run: ./mvnw clean test

      - name: Package Application (JAR)
        run: ./mvnw package -DskipTests

      - name: Archive Web Services Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restopilot-web-services-jar
          path: target/*.jar
          retention-days: 7
