server:
  port: ${PORT:8081}

spring:
  application:
    name: RestoPilot API
  ai:
    model:
      chat: ${RESTOPILOT_AI_CHAT_PROVIDER:none}
      embedding:
        text: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  # Clave secreta HMAC en Base64
  secret: ${JWT_SECRET}
  # Tiempo de vida del token 24 horas
  expiration: ${JWT_EXPIRATION:86400000}

restopilot:
  demo:
    enabled: ${DEMO_ENABLED:false}
  reservas:
    expiracion:
      enabled: ${RESERVAS_EXPIRACION_ENABLED:true}
      intervalo-ms: 30000
